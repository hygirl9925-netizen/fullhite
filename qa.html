<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자주 묻는 질문 | 라떼드레스룸</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b3a29">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
.search{max-width:420px;margin-bottom:16px}
.faq{display:grid;border-top:1px solid var(--line);margin-top:20px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;padding:18px 4px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .q{font-family:var(--display);color:var(--accent);font-weight:700}
.faq summary .t{font-weight:500}
.faq summary::after{content:"+";font-size:1.3rem;color:var(--muted)}
.faq details[open] summary::after{content:"−"}
.faq .a{padding:0 4px 20px 4px;color:var(--muted);max-width:70ch}
.faq .a p{margin:0}
@media (max-width:560px){.faq summary{grid-template-columns:auto 1fr auto}.faq summary .tag{display:none}}
.ask{margin-top:36px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
</style>
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <p class="eyebrow">Q&amp;A</p>
    <h1>자주 묻는 질문</h1>
    <p class="lead">설치, A/S, 견적, 제품, 주문 변경까지 카테고리별로 모았습니다.</p>
  </div>
  <label class="search" for="q">질문 검색<input id="q" type="search" placeholder="예: 타공, 이사, 환불"></label>
  <div class="chips" id="cats"></div>
  <div class="faq" id="faq"></div>
  <div class="card ask">
    <div><b>찾는 답이 없나요?</b><div class="small">카카오톡 채널로 물어보시면 담당자가 답변해 드립니다.</div></div>
    <a class="btn primary" id="askBtn" href="#" target="_blank" rel="noopener">카카오로 문의하기</a>
  </div>
</main>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script>
/* ▼ 질문 목록 — 자유롭게 추가·수정하세요 */
const FAQ = [
  ['설치','벽에 구멍을 뚫지 않고 정말 튼튼한가요?','네. 기둥을 천장과 바닥 사이에 압착해 세우는 방식이라 타공이 필요 없습니다. 기둥 사이를 선반과 상단 바로 서로 묶어 하중을 나누기 때문에 옷을 가득 걸어도 흔들림이 거의 없습니다.'],
  ['설치','설치 시간은 얼마나 걸리나요?','방 하나 기준 보통 2~4시간입니다. ㄷ자·ㅁ자처럼 벽면이 많거나 옵션이 많으면 반나절 정도 걸릴 수 있습니다.'],
  ['설치','천장 높이가 낮거나 높아도 설치되나요?','2,000~2,800mm 범위의 천장에 맞출 수 있습니다. 2,500mm를 넘으면 긴 기둥을 쓰기 때문에 소정의 추가 비용이 붙습니다.'],
  ['설치','몰딩이나 우물천장이 있어도 괜찮나요?','대부분 가능합니다. 견적 신청 후 천장 사진을 보내 주시면 기둥 위치를 미리 잡아 드립니다.'],
  ['A/S','A/S 기간은 어떻게 되나요?','설치일로부터 1년 동안 부품 불량은 무상으로 교체해 드립니다. 이후에는 부품비만 받고 처리해 드립니다.'],
  ['A/S','이사 갈 때 옮겨서 다시 설치할 수 있나요?','네, 라떼름의 가장 큰 장점입니다. 분해·재설치 서비스를 신청하시면 새 집 천장 높이에 맞춰 다시 세워 드립니다. 직접 옮기셔도 됩니다.'],
  ['견적/가격','견적 계산기 금액과 실제 금액이 다를 수 있나요?','계산기는 예상 금액입니다. 실측이나 사진 확인 후 기둥 개수와 옵션이 조정되면 금액이 달라질 수 있고, 확정 도면을 드릴 때 최종 금액을 함께 안내합니다.'],
  ['견적/가격','배송비는 따로 있나요?','수도권은 무료이고, 그 밖의 지역은 지역별 추가 요금이 있습니다. 제주와 도서 지역은 현재 배송이 어렵습니다.'],
  ['견적/가격','최소 주문 금액이 있나요?','설치 기사님이 방문하는 제품이라 최소 주문 금액이 있습니다. 견적 계산기에서 자동으로 적용됩니다.'],
  ['소재/제품','프레임과 선반은 어떤 소재인가요?','프레임은 알루미늄, 선반은 E0 등급 PB에 LPM 마감을 사용합니다. 습기에 강하고 오염을 닦아 내기 쉽습니다.'],
  ['소재/제품','선반 한 칸에 얼마나 올릴 수 있나요?','폭 800mm 선반 기준 약 30kg까지 권장합니다. 무거운 짐은 아래 칸에 두시는 것이 좋습니다.'],
  ['주문/변경','주문 후 구성을 바꿀 수 있나요?','도면 확정 전까지는 자유롭게 바꿀 수 있습니다. 확정 후에는 제작이 시작되어 변경 시 추가 비용이 생길 수 있습니다.'],
  ['주문/변경','결제는 어떻게 하나요?','도면 확정 후 안내해 드리는 결제 링크로 진행합니다. 결제 대금은 구매안전서비스로 보호됩니다.'],
  ['주문/변경','주문 진행 상황은 어디서 보나요?','상단의 마이 메뉴에서 신청번호와 연락처로 조회할 수 있습니다.'],
  ['기타','쇼룸이 있나요?','현재는 온라인 상담 위주로 운영합니다. 시공사례 페이지에서 실제 설치 구성을 확인해 보세요.']
];
const CATS = ['전체','설치','A/S','견적/가격','소재/제품','주문/변경','기타'];
let cat = '전체';
const $ = id => document.getElementById(id);
function render(){
  $('cats').innerHTML = CATS.map(c=>`<button type="button" class="chip" aria-pressed="${cat===c}">${c}</button>`).join('');
  const kw = $('q').value.trim();
  const list = FAQ.map((f,i)=>({c:f[0],q:f[1],a:f[2],no:i+1}))
    .filter(f=>(cat==='전체'||f.c===cat) && (!kw || (f.q+f.a).includes(kw)));
  $('faq').innerHTML = list.length ? list.map(f=>`<details id="q${f.no}"><summary><span class="q">Q</span><span class="tag">${f.c}</span><span class="t">${f.q}</span></summary><div class="a"><p>${f.a}</p></div></details>`).join('')
    : '<p class="muted" style="padding:40px 0;text-align:center">검색 결과가 없습니다.</p>';
}
$('cats').onclick = e => { const b = e.target.closest('.chip'); if(b){ cat = b.textContent; render(); } };
$('q').oninput = render;
$('askBtn').href = SITE.kakao;
render();
const m = location.hash.match(/^#q(\d+)$/); if(m){ const d = $('q'+m[1]); if(d){ d.open = true; d.scrollIntoView(); } }
</script>
</body>
</html>
